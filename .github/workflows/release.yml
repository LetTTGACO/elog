name: Release
run-name: Release ${{ inputs.channel }} (dry run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        type: choice
        options:
          - beta
          - latest
        default: beta
        required: true
      dry_run:
        description: Preview versions and packages without publishing or pushing
        type: boolean
        default: true
        required: true
      version:
        description: Optional exact version for all release packages (e.g. 1.0.0 to promote betas)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-v1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
      HUSKY: '0'
      RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check release branch
        id: branch
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$RELEASE_REPOSITORY" != 'LetTTGACO/elog' || "$RELEASE_REF" != 'refs/heads/v1' ]]; then
            echo '::error::Run this workflow on the v1 branch of LetTTGACO/elog.'
            exit 1
          fi

      - name: Set report directory
        run: echo "RELEASE_REPORT_DIR=$RUNNER_TEMP/release-report" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        id: checkout
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@v6
        id: pnpm

      - name: Install dependencies
        id: install
        run: node .github/scripts/release-report.mjs run install pnpm install --frozen-lockfile

      - name: Build
        id: build
        run: node .github/scripts/release-report.mjs run build pnpm build

      - name: Typecheck
        id: typecheck
        run: node .github/scripts/release-report.mjs run typecheck pnpm typecheck

      - name: Test release report
        id: report_test
        run: node .github/scripts/release-report.mjs run report_test node --test .github/scripts/release-report.test.mjs

      - name: Test
        id: test
        run: >-
          node .github/scripts/release-report.mjs run test pnpm test --
          --reporter=default --reporter="$GITHUB_WORKSPACE/.github/scripts/vitest-report.mjs"

      - name: Prepare release commit
        id: prepare
        run: |
          git checkout -B v1 "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote_sha=$(git ls-remote origin refs/heads/v1 | cut -f1)
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::v1 changed after this run started. Start a new release run.'
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo '::error::Build or verification changed tracked files.'
            git status --short
            exit 1
          fi

      - name: Calculate release plan
        id: plan
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo '::error::version must be an exact semantic version.'
              exit 1
            fi
          fi
          if [[ "$RELEASE_CHANNEL" == 'latest' ]]; then
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              echo '::error::Use the beta channel for prerelease versions.'
              exit 1
            fi
            if [[ -z "$RELEASE_VERSION" ]]; then
              node --input-type=module <<'NODE'
          import { globSync, readFileSync } from 'node:fs';
          const { release } = JSON.parse(readFileSync('nx.json', 'utf8'));
          for (const path of globSync(['packages/*/package.json', 'plugins/*/*/package.json'])) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            if (release.projects.includes(pkg.name) && pkg.version.includes('-')) {
              throw new Error('Set an exact stable version to promote prereleases to latest.');
            }
          }
          NODE
            fi
          fi
          node .github/scripts/release-report.mjs run plan node .github/scripts/release-report.mjs plan

      - name: Release with Nx and OIDC
        id: release
        run: |
          args=()
          if [[ "$RELEASE_DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            args=("$RELEASE_VERSION" "${args[@]}")
          fi
          case "$RELEASE_CHANNEL" in
            beta) node .github/scripts/release-report.mjs run release pnpm release:beta "${args[@]}" ;;
            latest) node .github/scripts/release-report.mjs run release pnpm release "${args[@]}" ;;
            *) echo '::error::Unknown release channel'; exit 1 ;;
          esac

      - name: Push release commit and tags
        id: push
        if: ${{ !inputs.dry_run }}
        run: node .github/scripts/release-report.mjs run push git push --atomic origin HEAD:refs/heads/v1 --follow-tags

      - name: Save release recovery snapshot
        id: recovery
        if: ${{ always() && !inputs.dry_run && contains(fromJSON('["success", "failure", "cancelled"]'), steps.release.outcome) }}
        timeout-minutes: 1
        run: node .github/scripts/release-report.mjs recovery

      - name: Verify published versions and Git refs
        id: verify
        if: ${{ always() && !inputs.dry_run && contains(fromJSON('["success", "failure", "cancelled"]'), steps.release.outcome) }}
        timeout-minutes: 7
        run: node .github/scripts/release-report.mjs run verify node .github/scripts/release-report.mjs verify

      - name: Upload failed release history
        if: ${{ always() && !inputs.dry_run && steps.recovery.outcome == 'success' && (failure() || cancelled()) }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: release-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_REPORT_DIR }}/recovery/
          if-no-files-found: error
          retention-days: 7

      - name: Generate release summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node .github/scripts/release-report.mjs summary

      - name: Upload release report
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-report
          path: ${{ runner.temp }}/release-report/
          retention-days: 14
